[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["hardware: opt-in tests against an explicitly supplied test panel"]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv-ha", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
